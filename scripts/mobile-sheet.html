<!doctype html>
<meta charset="utf-8">
<title>sheet</title>
<style>
  body { margin: 0; background: #e5e7eb; font: 13px/1.3 system-ui, sans-serif; }
  .grid { display: flex; flex-wrap: wrap; gap: 10px; padding: 10px; align-items: flex-start; }
  .cell { background: #fff; box-shadow: 0 0 0 1px #9ca3af; }
  .cap { padding: 3px 6px; font-weight: 600; background: #111827; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .frame { overflow: hidden; position: relative; }
  iframe { border: 0; transform-origin: 0 0; background: #fff; }
</style>
<div class="grid" id="g"></div>
<script type="module">
  const q = new URLSearchParams(location.search)
  const lists = await import('/__audit.mjs?v=' + Date.now())
  const urls = (q.get('urls') ? q.get('urls').split(',') : lists[q.get('set')]).slice(Number(q.get('from') || 0), Number(q.get('to') || 999))
  const w = Number(q.get('w') || 390), h = Number(q.get('h') || 844), s = Number(q.get('s') || 1)
  const label = q.get('label') || ''
  const base = q.get('base') || ''
  const g = document.getElementById('g')
  for (const u of urls) {
    const cell = document.createElement('div'); cell.className = 'cell'; cell.style.width = w * s + 'px'
    cell.innerHTML = `<div class="cap">${label} ${u.length > 60 ? u.slice(0, 28) + '…' + u.slice(-20) : u}</div><div class="frame" style="width:${w * s}px;height:${h * s}px"><iframe style="width:${w}px;height:${h}px;transform:scale(${s})" src="${base}${u}"></iframe></div>`
    g.appendChild(cell)
  }
  window.__ready = new Promise(r => setTimeout(r, Number(q.get('wait') || 4000)))
</script>
